<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgMascot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Golden Magic Gradient -->
    <linearGradient id="goldGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Skin Tone Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>

    <!-- Hair Tone Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#332211" />
      <stop offset="100%" stop-color="#1E140A" />
    </linearGradient>

    <!-- Clothes Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <!-- Soft Glow -->
    <filter id="softGlowM" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Frame (Matches YouTube PFP Crop) -->
  <circle cx="400" cy="400" r="390" fill="url(#bgMascot)" stroke="#FDE047" stroke-width="10" />

  <!-- Ambient Golden Magic Ring -->
  <circle cx="400" cy="400" r="350" fill="none" stroke="#60A5FA" stroke-width="3" stroke-dasharray="10 14" opacity="0.5" />
  <circle cx="400" cy="380" r="220" fill="#FDE047" opacity="0.18" filter="url(#softGlowM)" />

  <!-- Floating Sparkles -->
  <polygon points="160,200 170,220 190,230 170,240 160,260 150,240 130,230 150,220" fill="#FDE047" />
  <polygon points="630,220 640,240 660,250 640,260 630,280 620,260 600,250 620,240" fill="#FDE047" />
  <circle cx="230" cy="160" r="7" fill="#FDE047" />
  <circle cx="580" cy="160" r="6" fill="#FDE047" />
  <circle cx="670" cy="340" r="8" fill="#FFFFFF" opacity="0.8" />
  <circle cx="130" cy="360" r="7" fill="#FFFFFF" opacity="0.8" />

  <!-- Crescent Moon in Background -->
  <path d="M 600 140 A 60 60 0 0 0 660 200 A 46 46 0 0 1 600 140 Z" fill="url(#goldGradM)" filter="url(#softGlowM)" />

  <!-- Mascot Character: "Zayn" -->
  <g id="mascot">
    <!-- Body / Shoulders -->
    <path d="M 280 570 C 280 480, 520 480, 520 570 L 540 680 L 260 680 Z" fill="url(#shirtGrad)" />
    <!-- White Collar -->
    <path d="M 370 480 L 400 520 L 430 480 Z" fill="#FFFFFF" />

    <!-- Neck -->
    <rect x="375" y="445" width="50" height="40" rx="8" fill="#FDBA74" />

    <!-- Cute Round Ears -->
    <circle cx="305" cy="370" r="26" fill="url(#skinGrad)" />
    <circle cx="305" cy="370" r="14" fill="#F472B6" opacity="0.5" />
    <circle cx="495" cy="370" r="26" fill="url(#skinGrad)" />
    <circle cx="495" cy="370" r="14" fill="#F472B6" opacity="0.5" />

    <!-- Cute Chubby Face -->
    <ellipse cx="400" cy="375" rx="100" ry="92" fill="url(#skinGrad)" />

    <!-- Cheeks (Blushing) -->
    <ellipse cx="335" cy="405" rx="18" ry="12" fill="#FB7185" opacity="0.45" />
    <ellipse cx="465" cy="405" rx="18" ry="12" fill="#FB7185" opacity="0.45" />

    <!-- Hair (Back/Base) -->
    <path d="M 290 350 C 290 230, 510 230, 510 350 C 510 290, 480 250, 400 250 C 320 250, 290 290, 290 350 Z" fill="url(#hairGrad)" />
    <!-- Playful Hair Bangs -->
    <path d="M 305 320 Q 345 350 365 310 Q 395 355 425 305 Q 455 350 495 320 Q 480 260 400 255 Q 320 260 305 320 Z" fill="url(#hairGrad)" />

    <!-- Expressive Friendly Eyes -->
    <!-- Left Eye -->
    <ellipse cx="355" cy="375" rx="16" ry="20" fill="#1E1B4B" />
    <ellipse cx="360" cy="368" rx="7" ry="9" fill="#FFFFFF" />
    <circle cx="350" cy="384" r="4" fill="#FFFFFF" />
    <!-- Right Eye -->
    <ellipse cx="445" cy="375" rx="16" ry="20" fill="#1E1B4B" />
    <ellipse cx="450" cy="368" rx="7" ry="9" fill="#FFFFFF" />
    <circle cx="440" cy="384" r="4" fill="#FFFFFF" />

    <!-- Eyebrows (Cheerful Arch) -->
    <path d="M 338 342 Q 355 330 375 342" fill="none" stroke="#332211" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 425 342 Q 445 330 462 342" fill="none" stroke="#332211" stroke-width="4.5" stroke-linecap="round" />

    <!-- Cute Button Nose -->
    <ellipse cx="400" cy="392" rx="4" ry="3" fill="#EA580C" opacity="0.7" />

    <!-- Big Happy Smile -->
    <path d="M 378 412 Q 400 435 422 412" fill="#BE123C" stroke="#332211" stroke-width="3" stroke-linecap="round" />
    <!-- Cute Tooth highlight -->
    <path d="M 390 413 Q 400 417 410 413 Z" fill="#FFFFFF" />
  </g>

  <!-- Open Glowing Book Held in Front -->
  <g transform="translate(0, 15)">
    <!-- Book Outer Cover Glow -->
    <ellipse cx="400" cy="550" rx="200" ry="40" fill="#FDE047" opacity="0.3" filter="url(#softGlowM)" />

    <!-- Left Page -->
    <path d="M 230 520 Q 395 540 400 495 L 400 560 Q 395 605 230 585 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <!-- Right Page -->
    <path d="M 570 520 Q 405 540 400 495 L 400 560 Q 405 605 570 585 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <!-- Book Spine Ribbon -->
    <path d="M 396 495 L 404 495 L 404 600 L 396 600 Z" fill="url(#goldGradM)" />

    <!-- Mascot Hands Holding Book -->
    <ellipse cx="270" cy="540" rx="18" ry="14" fill="url(#skinGrad)" stroke="#FDBA74" stroke-width="2" />
    <ellipse cx="530" cy="540" rx="18" ry="14" fill="url(#skinGrad)" stroke="#FDBA74" stroke-width="2" />

    <!-- Magic Stars Floating from Pages -->
    <polygon points="370,470 376,482 388,488 376,494 370,506 364,494 352,488 364,482" fill="#FDE047" />
    <polygon points="430,460 435,470 445,475 435,480 430,490 425,480 415,475 425,470" fill="#38BDF8" />
  </g>

  <!-- Bottom Brand Plaque Banner -->
  <g transform="translate(0, 10)">
    <rect x="200" y="625" width="400" height="75" rx="38" fill="#1E1B4B" stroke="url(#goldGradM)" stroke-width="4" filter="url(#softGlowM)" />
    
    <text x="400" y="663" font-family="'Nunito', 'Fredoka', 'Comic Sans MS', sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
      ZAYN
    </text>
    <text x="400" y="685" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" fill="#FDE047" text-anchor="middle" letter-spacing="4">
      ADYAN RAMADHAN
    </text>
  </g>
</svg>

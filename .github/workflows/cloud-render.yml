name: Cloud Video Renderer (Remotion)

on:
  workflow_dispatch:
    inputs:
      book:
        description: 'Storybook Slug to Render (e.g. jangan-sekarang, kacamata-nenek, topsy-turvy-serba-terbalik)'
        required: true
        type: string
        default: 'jangan-sekarang'
      lang:
        description: 'Target Language'
        required: true
        type: choice
        options:
          - 'id'
          - 'en'
          - 'all'
        default: 'id'
      format:
        description: 'Video Format / Orientation'
        required: true
        type: choice
        options:
          - 'landscape'
          - 'vertical'
          - 'both'
        default: 'both'
      resolution:
        description: 'Resolution'
        required: true
        type: choice
        options:
          - '1080p'
          - '4k'
        default: '1080p'

permissions:
  contents: write

jobs:
  render:
    name: Render Storybook Video (${{ inputs.book }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install System Dependencies (Chromium, FFmpeg & Poppler)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 2>/dev/null || sudo apt-get install -y --no-install-recommends poppler-utils ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 🌐 Ensure Remotion Headless Browser
        run: npx --yes @remotion/cli browser ensure 2>/dev/null || true

      - name: ☁️ Resolve Story Assets (Pull R2 or Auto-Ingest)
        env:
          R2_ACCOUNT_ID: ${{ secrets.PERSONAL_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.PERSONAL_R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.PERSONAL_R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_DOMAIN: ${{ secrets.PERSONAL_R2_PUBLIC_DOMAIN }}
          GEMINI_API_KEY: ${{ secrets.PERSONAL_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.PERSONAL_GROQ_API_KEY || secrets.GROQ_API_KEY }}
        run: |
          mkdir -p config
          cat <<EOF > config/r2-config.json
          {
            "accountId": "${R2_ACCOUNT_ID}",
            "endpoint": "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com",
            "accessKeyId": "${R2_ACCESS_KEY_ID}",
            "secretAccessKey": "${R2_SECRET_KEY}",
            "bucketName": "zayn-storybook",
            "publicDomain": "${R2_PUBLIC_DOMAIN:-https://pub-f2786231e5e34f19a6860d7fe9ddd569.r2.dev}"
          }
          EOF

          echo "Checking if [${{ inputs.book }}] exists in Cloudflare R2..."
          npx tsx scripts/manage-story-storage.ts pull "${{ inputs.book }}" || true

          if [ ! -f "stories/${{ inputs.book }}/story.json" ]; then
            echo "Story manifest not found in R2. Executing automated ingestion on Ubuntu runner..."
            npx tsx scripts/ingest-story.ts --book "${{ inputs.book }}"
          fi

      - name: 🎬 Render Storybook Video
        run: |
          echo "Rendering ${{ inputs.book }} [${{ inputs.lang }}] in ${{ inputs.format }} format..."
          npx tsx scripts/render-book.ts --book "${{ inputs.book }}" --lang "${{ inputs.lang }}" --format "${{ inputs.format }}" --resolution "${{ inputs.resolution }}"

      - name: ☁️ Sync Updated Render Metadata to Cloudflare R2
        run: |
          npx tsx scripts/manage-story-storage.ts push "${{ inputs.book }}" --manifest-only || true

      - name: 📤 Upload Rendered Videos as GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.book }}-${{ inputs.lang }}-${{ inputs.format }}-videos
          path: stories/${{ inputs.book }}/exports/**/*.mp4
          retention-days: 7
          if-no-files-found: warn

      - name: 📊 Post Job Summary
        run: |
          echo "### 🎬 Video Render Complete!" >> $GITHUB_STEP_SUMMARY
          echo "- **Book**: \`${{ inputs.book }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Language**: \`${{ inputs.lang }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Format**: \`${{ inputs.format }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Resolution**: \`${{ inputs.resolution }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts are retained for 7 days in the summary tab." >> $GITHUB_STEP_SUMMARY

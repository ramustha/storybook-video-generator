name: Deploy Storybook Catalog to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'stories/**'
      - 'functions/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name for Pages deployment'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy Portal
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 📚 Rebuild Documentation & Catalog Portal
        run: npm run docs:portal

      - name: 🚀 Deploy to Cloudflare Pages
        run: |
          npx --yes wrangler pages project create storybook-catalog --production-branch main || true
          npx --yes wrangler pages deploy docs --project-name=storybook-catalog --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

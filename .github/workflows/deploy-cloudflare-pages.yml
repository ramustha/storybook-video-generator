name: Deploy Storybook Catalog to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'stories/**'
      - 'scripts/generate-docs-portal.ts'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name for Pages deployment'
        required: false
        default: 'main'

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build & Deploy Portal
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 📚 Rebuild Documentation & Catalog Portal
        run: npm run docs:portal

      - name: 🚀 Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.PERSONAL_R2_ACCOUNT_ID }}
          projectName: 'storybook-catalog'
          directory: 'docs'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

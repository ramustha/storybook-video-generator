name: Edu-Motion CI Preview & Gate

on:
  pull_request:
    paths:
      - 'src/motion/**'
      - 'src/audio/tts-engine.ts'
      - 'scripts/pack-edu-motion.ts'
      - 'scripts/test-edu-motion-engine.ts'
      - 'scripts/verify-edu-motion-renders.ts'
      - '.github/workflows/edu-motion-preview.yml'
  workflow_dispatch:
    inputs:
      book:
        description: 'Edu-Motion Book Slug in R2 drafts/edu-motion/<slug>/motion-spec.json'
        required: true
        type: string
        default: 'edu-budi-papang-teripang'
      lang:
        description: 'Target Language'
        required: true
        type: choice
        options:
          - 'all'
          - 'id'
          - 'en'
        default: 'all'
      format:
        description: 'Video Format / Orientation'
        required: true
        type: choice
        options:
          - 'both'
          - 'vertical'
          - 'landscape'
        default: 'both'
      publish_to_r2:
        description: 'Promote approved assets + MP4s to production R2 (keep false for pure review)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  engine_unit_check:
    name: Edu-Motion Deterministic Engine Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: ✅ Run Edu-Motion Engine Unit Tests
        run: npx tsx scripts/test-edu-motion-engine.ts

  preview_render:
    name: Preview Render (${{ inputs.book }})
    if: github.event_name == 'workflow_dispatch'
    needs: engine_unit_check
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install System Dependencies (Chromium & FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 2>/dev/null || sudo apt-get install -y --no-install-recommends ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 🌐 Install Playwright Chromium for Motion Stage
        run: npx playwright install chromium

      - name: 🔑 Configure R2 Credentials Only (D1 & Social Disabled in Preview)
        env:
          R2_ACCOUNT_ID: ${{ secrets.PERSONAL_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.PERSONAL_R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.PERSONAL_R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_DOMAIN: ${{ secrets.PERSONAL_R2_PUBLIC_DOMAIN }}
        run: |
          mkdir -p config
          cat <<EOF > config/r2-config.json
          {
            "accountId": "${R2_ACCOUNT_ID}",
            "endpoint": "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com",
            "accessKeyId": "${R2_ACCESS_KEY_ID}",
            "secretAccessKey": "${R2_SECRET_KEY}",
            "bucketName": "zayn-storybook",
            "publicDomain": "${R2_PUBLIC_DOMAIN:-https://pub-f2786231e5e34f19a6860d7fe9ddd569.r2.dev}"
          }
          EOF

      - name: ⬇️ Fetch Draft motion-spec.json from Cloudflare R2
        run: |
          npx tsx scripts/manage-story-storage.ts draft-pull "${{ inputs.book }}"

      - name: 🎨 Deterministically Pack Edu-Motion Stage, TTS & Cover
        run: |
          npx tsx scripts/pack-edu-motion.ts --book "${{ inputs.book }}"

      - name: 🎬 Render MP4 Preview Videos (No D1 Sync)
        run: |
          FORMAT_ARG="${{ inputs.format }}"
          if [ "${FORMAT_ARG}" = "both" ]; then FORMAT_ARG="all"; fi
          npx tsx scripts/render-book.ts --book "${{ inputs.book }}" --lang "${{ inputs.lang }}" --format "${FORMAT_ARG}" --resolution 1080p --skip-d1

      - name: 🔍 Verify MP4 Streams, Duration Cap (<= 88s) & Extract Keyframes
        run: |
          npx tsx scripts/verify-edu-motion-renders.ts --book "${{ inputs.book }}"

      - name: 📤 Upload Rendered MP4s & Preview Keyframes as GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edu-motion-preview-${{ inputs.book }}-${{ inputs.lang }}-${{ inputs.format }}
          path: |
            stories/${{ inputs.book }}/exports/**/*.mp4
            stories/${{ inputs.book }}/exports/_preview_frames/*.png
          retention-days: 7

      - name: 📣 Send Telegram Preview Notification (Optional)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.PERSONAL_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.PERSONAL_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets not configured; skipping notification."
            exit 0
          fi
          STATUS_ICON="✅"
          if [ "${{ job.status }}" != "success" ]; then STATUS_ICON="❌"; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="${STATUS_ICON} <b>Edu-Motion CI Preview</b>%0A<b>Book:</b> <code>${{ inputs.book }}</code>%0A<b>Scope:</b> ${{ inputs.lang }} / ${{ inputs.format }}%0A<b>Publish R2:</b> ${{ inputs.publish_to_r2 }}%0A<a href=\"${RUN_URL}\">Open GitHub Run &amp; Download MP4 Artifacts</a>"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "text=${MSG}" > /dev/null || true

      - name: 🚀 Promote Approved Assets & MP4s to Production R2 (Explicit Opt-In Only)
        if: ${{ inputs.publish_to_r2 == true }}
        run: |
          npx tsx scripts/manage-story-storage.ts push "${{ inputs.book }}" --include-videos

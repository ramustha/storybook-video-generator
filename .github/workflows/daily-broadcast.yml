name: Zayn Storybook Daily Broadcast Scheduler

on:
  schedule:
    # 00:30 UTC = 07:30 WIB (Morning Teaser Announcement)
    - cron: '30 0 * * *'
    # 01:30 UTC = 08:30 WIB (Daily Morning Slot - English Feature)
    - cron: '30 1 * * *'
    # 10:30 UTC = 17:30 WIB (Evening Teaser Announcement)
    - cron: '30 10 * * *'
    # 11:30 UTC = 18:30 WIB (Daily Prime Bedtime Slot - Indonesian Bedtime Story)
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action (auto, announcement, broadcast)'
        required: true
        type: choice
        options:
          - 'auto'
          - 'announcement'
          - 'broadcast'
        default: 'auto'
      book:
        description: 'Target Book Slug (or "auto" from calendar)'
        required: true
        default: 'auto'
      lang:
        description: 'Language'
        required: true
        type: choice
        options:
          - 'auto'
          - 'id'
          - 'en'
        default: 'auto'
      slot:
        description: 'Target Slot (auto, morning, evening, all)'
        required: false
        type: choice
        options:
          - 'auto'
          - 'morning'
          - 'evening'
          - 'all'
        default: 'auto'
      dry_run:
        description: 'Dry Run Mode (Test without publishing)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  broadcast:
    name: Execute Daily Multi-Platform Broadcast
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install System Dependencies (Chromium & FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 2>/dev/null || sudo apt-get install -y --no-install-recommends ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 🌐 Ensure Remotion Headless Browser
        run: npx --yes @remotion/cli browser ensure 2>/dev/null || true

      - name: 🔑 Configure Secrets & Credentials
        env:
          META_ACCESS_TOKEN: ${{ secrets.PERSONAL_META_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.PERSONAL_META_APP_ID }}
          META_APP_SECRET: ${{ secrets.PERSONAL_META_APP_SECRET }}
          META_PAGE_ID: ${{ secrets.PERSONAL_META_FACEBOOK_PAGE_ID }}
          META_IG_ID: ${{ secrets.PERSONAL_META_INSTAGRAM_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.PERSONAL_THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.PERSONAL_THREADS_USER_ID }}
          THREADS_APP_ID: ${{ secrets.PERSONAL_THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.PERSONAL_THREADS_APP_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.PERSONAL_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.PERSONAL_R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.PERSONAL_R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_DOMAIN: ${{ secrets.PERSONAL_R2_PUBLIC_DOMAIN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.PERSONAL_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.PERSONAL_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.PERSONAL_R2_ACCOUNT_ID }}
        run: |
          mkdir -p config

          # 1. Setup .env
          cat <<EOF > .env
          PERSONAL_META_ACCESS_TOKEN="${META_ACCESS_TOKEN}"
          PERSONAL_META_APP_ID="${META_APP_ID}"
          PERSONAL_META_APP_SECRET="${META_APP_SECRET}"
          PERSONAL_META_FACEBOOK_PAGE_ID="${META_PAGE_ID}"
          PERSONAL_META_INSTAGRAM_USER_ID="${META_IG_ID}"
          THREADS_ACCESS_TOKEN="${THREADS_ACCESS_TOKEN}"
          THREADS_USER_ID="${THREADS_USER_ID}"
          THREADS_APP_ID="${THREADS_APP_ID}"
          THREADS_APP_SECRET="${THREADS_APP_SECRET}"
          YOUTUBE_CLIENT_ID="${YOUTUBE_CLIENT_ID}"
          YOUTUBE_CLIENT_SECRET="${YOUTUBE_CLIENT_SECRET}"
          YOUTUBE_REFRESH_TOKEN="${YOUTUBE_REFRESH_TOKEN}"
          TELEGRAM_BOT_TOKEN="${TELEGRAM_BOT_TOKEN}"
          TELEGRAM_CHAT_ID="${TELEGRAM_CHAT_ID}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN}"
          CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID}"
          EOF

          # 2. Setup config/meta-config.json
          cat <<EOF > config/meta-config.json
          {
            "appId": "${META_APP_ID}",
            "facebookPageId": "${META_PAGE_ID:-1473240609201601}",
            "facebookPageName": "Zayn Storybook",
            "instagramUserId": "${META_IG_ID:-17841477003917879}",
            "instagramUsername": "zayn.storybook",
            "pageAccessToken": "${META_ACCESS_TOKEN}",
            "threadsUserId": "${THREADS_USER_ID:-31322011817419464}",
            "threadsUsername": "zayn.storybook",
            "threadsAccessToken": "${THREADS_ACCESS_TOKEN}",
            "threadsAppId": "${THREADS_APP_ID:-1507655221210490}",
            "threadsAppSecret": "${THREADS_APP_SECRET:-0e476feb253e7a84a263e5a2c6069626}"
          }
          EOF

          # 2.5 Setup config/telegram-config.json
          cat <<EOF > config/telegram-config.json
          {
            "botToken": "${TELEGRAM_BOT_TOKEN}",
            "chatId": "${TELEGRAM_CHAT_ID}"
          }
          EOF

          # 3. Setup config/r2-config.json
          cat <<EOF > config/r2-config.json
          {
            "accountId": "${R2_ACCOUNT_ID}",
            "endpoint": "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com",
            "accessKeyId": "${R2_ACCESS_KEY_ID}",
            "secretAccessKey": "${R2_SECRET_KEY}",
            "bucketName": "zayn-storybook",
            "publicDomain": "${R2_PUBLIC_DOMAIN:-https://pub-f2786231e5e34f19a6860d7fe9ddd569.r2.dev}"
          }
          EOF

          # 3.2 Setup config/d1-config.json
          cat <<EOF > config/d1-config.json
          {
            "accountId": "e5c0394bca4b8239f091b55cb3e9d3e6",
            "databaseId": "a979ff27-bed2-4428-a4af-eae976a24253",
            "databaseName": "zayn-storybook-db",
            "region": "APAC"
          }
          EOF

          # 3.5 Setup config/youtube-credentials.json & config/youtube-token.json
          if [ -n "${YOUTUBE_CLIENT_ID}" ] && [ -n "${YOUTUBE_CLIENT_SECRET}" ]; then
            cat <<EOF > config/youtube-credentials.json
          {
            "installed": {
              "client_id": "${YOUTUBE_CLIENT_ID}",
              "client_secret": "${YOUTUBE_CLIENT_SECRET}",
              "redirect_uris": ["http://localhost:3000/oauth2callback"]
            }
          }
          EOF
          fi

          if [ -n "${YOUTUBE_REFRESH_TOKEN}" ]; then
            cat <<EOF > config/youtube-token.json
          {
            "refresh_token": "${YOUTUBE_REFRESH_TOKEN}"
          }
          EOF
          fi

          # 4. Export all variables to GITHUB_ENV cleanly (no surrounding quotes)
          echo "YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID}" >> $GITHUB_ENV
          echo "YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET}" >> $GITHUB_ENV
          echo "YOUTUBE_REFRESH_TOKEN=${YOUTUBE_REFRESH_TOKEN}" >> $GITHUB_ENV
          echo "PERSONAL_META_ACCESS_TOKEN=${META_ACCESS_TOKEN}" >> $GITHUB_ENV
          echo "PERSONAL_META_APP_ID=${META_APP_ID}" >> $GITHUB_ENV
          echo "PERSONAL_META_APP_SECRET=${META_APP_SECRET}" >> $GITHUB_ENV
          echo "PERSONAL_META_FACEBOOK_PAGE_ID=${META_PAGE_ID}" >> $GITHUB_ENV
          echo "PERSONAL_META_INSTAGRAM_USER_ID=${META_IG_ID}" >> $GITHUB_ENV
          echo "THREADS_ACCESS_TOKEN=${THREADS_ACCESS_TOKEN}" >> $GITHUB_ENV
          echo "THREADS_USER_ID=${THREADS_USER_ID}" >> $GITHUB_ENV
          echo "THREADS_APP_ID=${THREADS_APP_ID}" >> $GITHUB_ENV
          echo "THREADS_APP_SECRET=${THREADS_APP_SECRET}" >> $GITHUB_ENV
          echo "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}" >> $GITHUB_ENV
          echo "TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}" >> $GITHUB_ENV
          echo "CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}" >> $GITHUB_ENV

      - name: 🚀 Execute Scheduled Daily Broadcast or Teaser Announcement
        id: run_broadcast
        env:
          INPUT_ACTION: ${{ inputs.action || 'auto' }}
          INPUT_BOOK: ${{ inputs.book || 'auto' }}
          INPUT_LANG: ${{ inputs.lang || 'auto' }}
          INPUT_SLOT: ${{ inputs.slot || 'auto' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run || false }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.PERSONAL_META_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.PERSONAL_META_APP_ID }}
          META_APP_SECRET: ${{ secrets.PERSONAL_META_APP_SECRET }}
          META_PAGE_ID: ${{ secrets.PERSONAL_META_FACEBOOK_PAGE_ID }}
          META_IG_ID: ${{ secrets.PERSONAL_META_INSTAGRAM_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.PERSONAL_THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.PERSONAL_THREADS_USER_ID }}
          THREADS_APP_ID: ${{ secrets.PERSONAL_THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.PERSONAL_THREADS_APP_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.PERSONAL_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.PERSONAL_R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.PERSONAL_R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_DOMAIN: ${{ secrets.PERSONAL_R2_PUBLIC_DOMAIN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.PERSONAL_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.PERSONAL_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: |
          UTC_HOUR=$(date -u +%H)
          UTC_MIN=$(date -u +%M)

          IS_ANNOUNCEMENT="false"
          if [ "${INPUT_ACTION}" = "announcement" ]; then
            IS_ANNOUNCEMENT="true"
          elif [ "${INPUT_ACTION}" = "broadcast" ]; then
            IS_ANNOUNCEMENT="false"
          elif [ "${UTC_HOUR}" = "11" ] || ([ "${UTC_HOUR}" = "00" ] && [ "${UTC_MIN}" -ge "20" ]); then
            # 11:00 UTC = 18:00 WIB (1h before 19:00 WIB bedtime story)
            # 00:30 UTC = 07:30 WIB (1h before 08:30 WIB morning story)
            IS_ANNOUNCEMENT="true"
          fi

          if [ "${IS_ANNOUNCEMENT}" = "true" ]; then
            echo "📢 Running Pre-Broadcast Teaser Announcement Feed (1 Hour Prior)..."
            ARGS=""
            if [ "${INPUT_DRY_RUN}" = "true" ]; then ARGS="${ARGS} --dry-run"; fi
            if [ "${INPUT_BOOK}" != "auto" ]; then ARGS="${ARGS} --book ${INPUT_BOOK}"; fi
            if [ "${INPUT_LANG}" != "auto" ]; then ARGS="${ARGS} --lang ${INPUT_LANG}"; fi
            if [ -n "${INPUT_SLOT}" ] && [ "${INPUT_SLOT}" != "auto" ]; then ARGS="${ARGS} --slot ${INPUT_SLOT}"; fi

            echo "Running: npx tsx scripts/publish-announcement.ts ${ARGS}"
            npx tsx scripts/publish-announcement.ts ${ARGS}
          else
            echo "🎬 Running Full Video Broadcast Premiere..."
            ARGS="--publish-today"
            if [ "${INPUT_DRY_RUN}" = "true" ]; then ARGS="${ARGS} --dry-run"; fi
            if [ "${INPUT_BOOK}" != "auto" ]; then ARGS="${ARGS} --book ${INPUT_BOOK}"; fi
            if [ "${INPUT_LANG}" != "auto" ]; then ARGS="${ARGS} --lang ${INPUT_LANG}"; fi
            if [ -n "${INPUT_SLOT}" ]; then ARGS="${ARGS} --slot ${INPUT_SLOT}"; fi

            echo "Running: npx tsx scripts/content-calendar.ts ${ARGS}"
            npx tsx scripts/content-calendar.ts ${ARGS}
          fi

      - name: ☁️ Cloudflare D1 Metadata Verification
        if: ${{ !(inputs.dry_run) }}
        run: |
          echo "✔ Storybook publication metadata saved directly to Cloudflare D1 Serverless Database."
          echo "✔ Static Catalog Portal automatically hydrated in real-time without git commits."

      - name: 🚨 Notify Telegram on Workflow Failure
        if: failure()
        run: |
          npx tsx scripts/notify-telegram.ts --failure \
            --book "${{ inputs.book || 'auto' }}" \
            --lang "${{ inputs.lang || 'auto' }}" \
            --slot "${{ inputs.slot || 'auto' }}" \
            --platform "GitHub Actions Broadcast Job" \
            --error "GitHub Actions daily broadcast workflow execution failed. Check run details." \
            --run-id "${{ github.run_id }}"

      - name: 📊 Post Job Summary
        run: |
          echo "### 🌟 Zayn Storybook Broadcast Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: ${{ inputs.book || 'Auto (from Calendar)' }} [${{ inputs.lang || 'Auto' }}]" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run**: ${{ inputs.dry_run || false }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Waktu Rilis (WIB)**: $(TZ='Asia/Jakarta' date '+%A, %d %B %Y pukul %H:%M WIB')" >> $GITHUB_STEP_SUMMARY
          echo "- **UTC Reference**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "✔ Daily broadcast automation completed!" >> $GITHUB_STEP_SUMMARY

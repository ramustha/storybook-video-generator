name: Zayn Storybook Daily Ingestion & Plate Cleaning Engine

on:
  schedule:
    # 00:00 UTC = 07:00 WIB (Daily Morning Ingestion Slot before evening broadcast)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      book:
        description: 'Target Book Slug (or "auto" for next from curated pool)'
        required: true
        default: 'auto'
      force:
        description: 'Force re-ingest even if already in Cloudflare R2'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry Run Mode (Preview ingestion plan without mutations)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ingest:
    name: Ingest Open-License Story & Clean Plates
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 🌐 Ensure Remotion Headless Browser
        run: npx --yes @remotion/cli browser ensure 2>/dev/null || true

      - name: 🔑 Configure Cloudflare R2 Credentials
        env:
          R2_ACCOUNT_ID: ${{ secrets.PERSONAL_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.PERSONAL_R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.PERSONAL_R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_DOMAIN: ${{ secrets.PERSONAL_R2_PUBLIC_DOMAIN }}
        run: |
          mkdir -p config
          cat <<EOF > config/r2-config.json
          {
            "accountId": "${R2_ACCOUNT_ID}",
            "endpoint": "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com",
            "accessKeyId": "${R2_ACCESS_KEY_ID}",
            "secretAccessKey": "${R2_SECRET_KEY}",
            "bucketName": "zayn-storybook",
            "publicDomain": "${R2_PUBLIC_DOMAIN:-https://pub-f2786231e5e34f19a6860d7fe9ddd569.r2.dev}"
          }
          EOF

      - name: 🚀 Execute Story Ingestion & Apple Vision Inpainting
        id: run_ingest
        run: |
          ARGS=""
          if [ "${{ inputs.book }}" != "auto" ] && [ -n "${{ inputs.book }}" ]; then
            ARGS="--book ${{ inputs.book }}"
          else
            ARGS="--next"
          fi

          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "Running: npx tsx scripts/ingest-story.ts $ARGS"
          npx tsx scripts/ingest-story.ts $ARGS

      - name: 📊 Post Ingestion Job Summary
        if: always()
        run: |
          echo "## 📖 Zayn Storybook Daily Ingestion Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Workflow** | Daily Morning Ingestion & Plate Cleaning Engine |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Book** | ${{ inputs.book || 'auto (next from pool)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Apple Vision Inpainting** | Swift VNRecognizeTextRequest + Ambient Fill |" >> $GITHUB_STEP_SUMMARY
          echo "| **Remote Storage** | Cloudflare R2 (\`zayn-storybook\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Disk Purge** | Intermediate raw PDF & scans purged |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✨ New authentic story is processed and ready in Cloudflare R2 for tonight's broadcast pipeline!" >> $GITHUB_STEP_SUMMARY

name: Zayn Storybook Daily Ingestion & Plate Cleaning Engine

on:
  # Automated triggers migrated to Cloudflare Worker to avoid GitHub queue delays:
  # https://zayn-storybook-cron-trigger.atkcollection110.workers.dev
  # schedule:
  #   # 00:00 UTC = 07:00 WIB (Batch Buffer Ingestion on Monday & Thursday)
  #   - cron: '0 0 * * 1,4'
  workflow_dispatch:
    inputs:
      book:
        description: 'Target Book Slug (or "auto" for next from curated pool)'
        required: true
        default: 'auto'
      batch_size:
        description: 'Batch size: number of stories to ingest (e.g. 1, 3, 5, 10, or "all" to fill buffer)'
        required: false
        default: '1'
      force:
        description: 'Force re-ingest even if already in Cloudflare R2'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry Run Mode (Preview ingestion plan without mutations)'
        required: false
        type: boolean
        default: false
      skip_qc:
        description: 'Skip AI Quality Control and moral validation gate'
        required: false
        type: boolean
        default: false
      run_buffer:
        description: 'Pre-render next 3 days MP4 buffer & sync portal after ingestion'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ingest:
    name: Ingest Open-License Story & Clean Plates
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install System Dependencies (Poppler, Chromium & FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 2>/dev/null || sudo apt-get install -y --no-install-recommends poppler-utils ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 🌐 Ensure Remotion Headless Browser
        run: npx --yes @remotion/cli browser ensure 2>/dev/null || true

      - name: 🔑 Configure Cloudflare R2 & D1 Credentials
        env:
          R2_ACCOUNT_ID: ${{ secrets.PERSONAL_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.PERSONAL_R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.PERSONAL_R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_DOMAIN: ${{ secrets.PERSONAL_R2_PUBLIC_DOMAIN }}
        run: |
          mkdir -p config
          cat <<EOF > config/r2-config.json
          {
            "accountId": "${R2_ACCOUNT_ID}",
            "endpoint": "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com",
            "accessKeyId": "${R2_ACCESS_KEY_ID}",
            "secretAccessKey": "${R2_SECRET_KEY}",
            "bucketName": "zayn-storybook",
            "publicDomain": "${R2_PUBLIC_DOMAIN:-https://pub-f2786231e5e34f19a6860d7fe9ddd569.r2.dev}"
          }
          EOF

          cat <<EOF > config/d1-config.json
          {
            "accountId": "e5c0394bca4b8239f091b55cb3e9d3e6",
            "databaseId": "a979ff27-bed2-4428-a4af-eae976a24253",
            "databaseName": "zayn-storybook-db",
            "region": "APAC"
          }
          EOF

      - name: 🚀 Execute Story Ingestion & Apple Vision Inpainting
        id: run_ingest
        env:
          GEMINI_API_KEY: ${{ secrets.PERSONAL_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.PERSONAL_GROQ_API_KEY || secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.PERSONAL_R2_ACCOUNT_ID || 'e5c0394bca4b8239f091b55cb3e9d3e6' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.PERSONAL_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.PERSONAL_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled runs ingest upcoming calendar stories (default 7)
            ARGS="--limit 7"
          elif [ "${{ inputs.book }}" != "auto" ] && [ -n "${{ inputs.book }}" ]; then
            ARGS="--book ${{ inputs.book }}"
          elif [ "${{ inputs.batch_size }}" = "all" ]; then
            ARGS="--all"
          elif [ -n "${{ inputs.batch_size }}" ] && [ "${{ inputs.batch_size }}" != "1" ]; then
            ARGS="--limit ${{ inputs.batch_size }}"
          else
            ARGS="--next"
          fi

          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          if [ "${{ inputs.skip_qc }}" = "true" ]; then
            ARGS="$ARGS --skip-qc"
          fi

          echo "Running: npx tsx scripts/ingest-story.ts $ARGS"
          npx tsx scripts/ingest-story.ts $ARGS

      - name: ☁️ Sync Calendar & Run Pre-Render Buffer (Next 3 Days)
        if: ${{ inputs.dry_run != true && inputs.run_buffer != false }}
        env:
          GEMINI_API_KEY: ${{ secrets.PERSONAL_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.PERSONAL_GROQ_API_KEY || secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.PERSONAL_R2_ACCOUNT_ID || 'e5c0394bca4b8239f091b55cb3e9d3e6' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.PERSONAL_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.PERSONAL_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "📅 Synchronizing Month-1 calendar & books metadata with Cloudflare D1..."
          npx tsx scripts/migrate-to-d1.ts
          echo "🛡️ Running pre-render buffer for H+1..H+3..."
          npx tsx scripts/buffer-prerender.ts --days 3
          echo "🌐 Rebuilding & deploying updated portal..."
          npm run docs:portal || true
          npx --yes wrangler pages deploy docs --project-name storybook-catalog --branch main --commit-dirty=true || true

      - name: 🚨 Notify Telegram on Ingestion Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.PERSONAL_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.PERSONAL_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: |
          npx tsx scripts/notify-telegram.ts --failure \
            --book "${{ inputs.book || 'auto' }}" \
            --platform "GitHub Actions Batch Ingestion" \
            --error "Batch story ingestion workflow failed. Check GitHub Actions run logs." \
            --run-id "${{ github.run_id }}" || true

      - name: 📊 Post Ingestion Job Summary
        if: always()
        run: |
          echo "## 📖 Zayn Storybook Ingestion Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Workflow** | Bi-Weekly Batch Ingestion & Plate Cleaning Engine |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Book** | ${{ inputs.book || 'Batch Buffer (4 stories)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **AI Editorial & Moral Gate** | Google Gemini (Primary) + Groq (Failover) |" >> $GITHUB_STEP_SUMMARY
          echo "| **OCR Plate Inpainting & Centering** | Gemini Vision OCR + Sharp Smart Re-Centering |" >> $GITHUB_STEP_SUMMARY
          echo "| **Remote Storage** | Cloudflare R2 (\`zayn-storybook\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Disk Purge** | Intermediate raw PDF & scans purged |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✨ Authentic stories processed and stored in Cloudflare R2 ready for daily broadcast!" >> $GITHUB_STEP_SUMMARY

name: Zayn Storybook Automated Buffer Pre-Renderer

on:
  schedule:
    # 19:00 UTC = 02:00 WIB (Runs nightly in off-peak hours to pre-render next 3 days)
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days ahead to buffer pre-render (default: 3)'
        required: true
        type: string
        default: '3'
      force:
        description: 'Force re-render even if videos exist in R2'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Preview buffer candidates without rendering'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  buffer_prerender:
    name: Batch Pre-Render Buffer (Next ${{ inputs.days || '3' }} Days)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install System Dependencies (Chromium & FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 2>/dev/null || sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 🌐 Ensure Remotion Headless Browser
        run: npx --yes @remotion/cli browser ensure 2>/dev/null || true

      - name: 🔑 Configure R2 & D1 Secrets & Credentials
        env:
          R2_ACCOUNT_ID: ${{ secrets.PERSONAL_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.PERSONAL_R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.PERSONAL_R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_DOMAIN: ${{ secrets.PERSONAL_R2_PUBLIC_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p config
          cat <<EOF > config/r2-config.json
          {
            "accountId": "${R2_ACCOUNT_ID}",
            "endpoint": "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com",
            "accessKeyId": "${R2_ACCESS_KEY_ID}",
            "secretAccessKey": "${R2_SECRET_KEY}",
            "bucketName": "zayn-storybook",
            "publicDomain": "${R2_PUBLIC_DOMAIN:-https://pub-f2786231e5e34f19a6860d7fe9ddd569.r2.dev}"
          }
          EOF

          cat <<EOF > config/d1-config.json
          {
            "accountId": "e5c0394bca4b8239f091b55cb3e9d3e6",
            "databaseId": "a979ff27-bed2-4428-a4af-eae976a24253",
            "databaseName": "zayn-storybook-db",
            "region": "APAC"
          }
          EOF

      - name: 🛡️ Execute Automated Pre-Render Buffer Engine
        env:
          GEMINI_API_KEY: ${{ secrets.PERSONAL_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.PERSONAL_GROQ_API_KEY || secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.PERSONAL_R2_ACCOUNT_ID || 'e5c0394bca4b8239f091b55cb3e9d3e6' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.PERSONAL_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.PERSONAL_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS="--days ${{ inputs.days || '3' }}"
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="${ARGS} --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="${ARGS} --dry-run"; fi

          echo "Running: npx tsx scripts/buffer-prerender.ts ${ARGS}"
          npx tsx scripts/buffer-prerender.ts ${ARGS}

      - name: 🌐 Deploy Updated Portal Baseline to Cloudflare Pages
        if: ${{ !(inputs.dry_run) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.PERSONAL_R2_ACCOUNT_ID || 'e5c0394bca4b8239f091b55cb3e9d3e6' }}
        run: |
          npm run docs:portal || true
          npx --yes wrangler pages deploy docs --project-name storybook-catalog --branch main --commit-dirty=true || true

      - name: 🚨 Notify Telegram on Pre-Render Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.PERSONAL_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.PERSONAL_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: |
          npx tsx scripts/notify-telegram.ts --failure \
            --platform "GitHub Actions Buffer Pre-Render" \
            --error "Pre-render buffer workflow failed for H+1..H+${{ inputs.days || '3' }}. Check GitHub Actions logs." \
            --run-id "${{ github.run_id }}" || true

      - name: 📊 Post Job Summary
        run: |
          echo "### 🛡️ Zayn Storybook Buffer Pre-Render Complete!" >> $GITHUB_STEP_SUMMARY
          echo "- **Window**: Next ${{ inputs.days || '3' }} Days Ahead" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "✔ Rendered MP4 videos successfully cached in Cloudflare R2 for instant on-time daily broadcasting!" >> $GITHUB_STEP_SUMMARY

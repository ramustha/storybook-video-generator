name = "zayn-storybook-cron-trigger"
main = "src/index.js"
compatibility_date = "2024-09-23"
account_id = "e5c0394bca4b8239f091b55cb3e9d3e6"

# Cron Triggers (UTC) - 4 expressions (Cloudflare limit <= 5):
# 1. 00:00 / 12:00 / 19:00 UTC -> 07:00 WIB Ingest+Mon Analytics | 19:00 WIB Evening Broadcast | 02:00 WIB Pre-Render Buffer
# 2. 00:15 UTC = 07:15 WIB     -> Wave 1: Daily Unified Bilingual Announcement (Pre-Broadcast Teaser)
# 3. 01:30 UTC = 08:30 WIB     -> Morning Broadcast (English Feature & Read-Aloud)
# 4. 05:30 / 13:30 UTC         -> 12:30 WIB Wave 2 (Midday Watch-Now) | 20:30 WIB Wave 3 (Bedtime Highlight & Watch-Next)
[triggers]
crons = ["0 0,12,19 * * *", "15 0 * * *", "30 1 * * *", "30 5,13 * * *"]

[vars]
GITHUB_REPO = "ramustha/storybook-video-generator"

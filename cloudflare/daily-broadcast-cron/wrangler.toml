name = "zayn-storybook-cron-trigger"
main = "src/index.js"
compatibility_date = "2024-09-23"
account_id = "e5c0394bca4b8239f091b55cb3e9d3e6"

# Cron Triggers (UTC)
# 1. 00:30 UTC = 07:30 WIB (Daily Morning Teaser Announcement - 1h prior to morning broadcast)
# 2. 01:30 UTC = 08:30 WIB (Daily Morning Broadcast - English Feature & Read-Aloud)
# 3. 10:30 UTC = 17:30 WIB (Daily Evening Teaser Announcement - 1h prior to bedtime broadcast)
# 4. 11:30 UTC = 18:30 WIB (Daily Prime Bedtime Story Broadcast - Indonesian Story)
# 5. 00:00 UTC = 07:00 WIB (Mon & Thu: Ingestion Buffer | Mon: Weekly Analytics)
[triggers]
crons = ["30 0 * * *", "30 1 * * *", "30 10 * * *", "30 11 * * *", "0 0 * * 1,4"]

[vars]
GITHUB_REPO = "ramustha/storybook-video-generator"

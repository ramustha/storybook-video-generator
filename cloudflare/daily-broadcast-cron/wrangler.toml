name = "zayn-storybook-cron-trigger"
main = "src/index.js"
compatibility_date = "2024-09-23"
account_id = "e5c0394bca4b8239f091b55cb3e9d3e6"

# Cron Triggers (UTC)
# 1. 10:30 UTC = 17:30 WIB (Daily Teaser Announcement - 1h prior to bedtime broadcast)
# 2. 11:30 UTC = 18:30 WIB (Daily Prime Bedtime Story Broadcast - 1x per day, ID only)
# 3. 00:00 UTC = 07:00 WIB (Mon & Thu: Ingestion Buffer | Mon: Weekly Analytics)
[triggers]
crons = ["30 10 * * *", "30 11 * * *", "0 0 * * 1,4"]

[vars]
GITHUB_REPO = "ramustha/storybook-video-generator"

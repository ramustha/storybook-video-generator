name = "zayn-storybook-cron-trigger"
main = "src/index.js"
compatibility_date = "2024-09-23"
account_id = "e5c0394bca4b8239f091b55cb3e9d3e6"

# Cron Triggers (UTC) - 5 expressions (Cloudflare Free Tier limit = 5):
# 1. 00:00 / 12:00 / 19:00 UTC -> 07:00 WIB Ingest+Mon Analytics | 19:00 WIB Evening Broadcast | 02:00 WIB Pre-Render Buffer
# 2. 00:15 UTC = 07:15 WIB     -> Wave 1: Daily Unified Bilingual Announcement (Illustration Books)
# 3. 23:30 / 01:30 UTC         -> 06:30 WIB H-2 Morning Check | 08:30 WIB Morning Broadcast (English Illustration Book)
# 4. 05:30 / 13:30 UTC         -> 12:30 WIB Wave 2 | 20:30 WIB Wave 3 (Illustration Books Post-Publish)
# 5. 06:00 / 07:00 / 08:00 / 10:00 UTC -> Daily 17:00 WIB H-2 Evening Check + Sun (EN) & Wed (ID) Full-Motion (13:00 H-2 / 14:00 Before / 15:00 Broadcast / 17:00 After WIB)
[triggers]
crons = ["0 0,12,19 * * *", "15 0 * * *", "30 1,23 * * *", "30 5,13 * * *", "0 6,7,8,10 * * *"]

[vars]
GITHUB_REPO = "ramustha/storybook-video-generator"

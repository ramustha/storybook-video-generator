name = "zayn-storybook-cron-trigger"
main = "src/index.js"
compatibility_date = "2024-09-23"
account_id = "e5c0394bca4b8239f091b55cb3e9d3e6"

# Cron Triggers (UTC)
# 1. 00:15 UTC = 07:15 WIB (Single Daily Unified Bilingual Announcement - Morning & Evening Lineup)
# 2. 01:30 UTC = 08:30 WIB (Daily Morning Broadcast - English Feature & Read-Aloud)
# 3. 12:00 UTC = 19:00 WIB (Daily Prime Bedtime Story Broadcast - Indonesian Story)
# 4. 00:00 UTC = 07:00 WIB (Mon & Thu: Ingestion Buffer | Mon: Weekly Analytics & Storage Cleanup)
[triggers]
crons = ["15 0 * * *", "30 1 * * *", "0 12 * * *", "0 0 * * 1,4"]

[vars]
GITHUB_REPO = "ramustha/storybook-video-generator"
